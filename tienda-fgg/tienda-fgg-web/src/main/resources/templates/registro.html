<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
    <meta charset="UTF-8">
    <title>Registro | FGG Store</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <head th:replace="~{fragments :: head_comun('Registro')}"></head>
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
    
        .section-spacing {
            padding: 60px 0;
            display: flex;
            justify-content: center;
        }
    </style>
    <body>
        <main class="container section-spacing">
            <div class="login-card">
                <h2>Crear Cuenta</h2>
                
                <div th:if="${errorRegistro}" class="error-msg">
                    ⚠️ <span th:text="${errorRegistro}"></span>
                </div>
        
                <form th:action="@{/register}" th:object="${usuario}" method="post">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" th:field="*{username}" id="username" placeholder="Mínimo 4 caracteres" required />
                        <small th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></small>
                    </div>
        
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" th:field="*{email}" id="email" placeholder="ejemplo@correo.com" required />
                        <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></small>
                    </div>
        
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" th:field="*{password}" id="password" placeholder="Mínimo 6 caracteres" required />
                        <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></small>
                    </div>
        
                    <div class="checkbox-group">
                        <input type="checkbox" th:field="*{aceptoCondiciones}" id="tos" required />
                        <label for="tos">Acepto las condiciones y la política de privacidad</label>
                    </div>
                    <small th:if="${#fields.hasErrors('aceptoCondiciones')}" th:errors="*{aceptoCondiciones}" class="text-danger" style="margin-top: -15px; margin-bottom: 15px;"></small>
        
                    <button type="submit" class="btn-login">Registrarse ahora</button>
                </form>
        
                <div class="footer-links">
                    ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a>
                    <br>
                    <a th:href="@{/}" class="back-home">← Volver a la tienda</a>
                </div>
            </div>
        </main>
    </body>
</html>

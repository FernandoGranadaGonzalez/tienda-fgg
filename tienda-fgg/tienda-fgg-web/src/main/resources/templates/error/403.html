<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="es">

    <head th:replace="~{fragments :: head_comun('Acceso Denegado')}"></head>

    <body>
        <div th:replace="~{fragments :: menu_navegacion}"></div>

        <main class="container" style="
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;">

            <div class="login-card" style="
                max-width: 480px; width: 100%;
                text-align: center;
                border-radius: 16px;
                padding: 48px 40px;">

                <div style="font-size: 4rem; margin-bottom: 16px; line-height: 1;">🚫</div>

                <p style="
                    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em;
                    text-transform: uppercase; color: #ef4444; margin: 0 0 8px 0;">
                    Error 403 — Acceso denegado
                </p>

                <h1 style="
                    font-size: 1.75rem; margin: 0 0 12px 0;">
                    Sin permisos
                </h1>

                <p style="color: #6b7280; margin: 0 0 32px 0; line-height: 1.6;">
                    No tienes permisos suficientes para ver esta sección.<br>
                    Si crees que es un error, contacta con el administrador.
                </p>

                <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                    <a th:href="@{/}" class="btn-login" style="display: inline-block;">
                        🏠 Volver al inicio
                    </a>
                    <a th:href="@{/login}"
                       sec:authorize="isAnonymous()"
                       class="btn-auth btn-login"
                       style="display: inline-block; background: transparent;
                              border: 2px solid currentColor; color: inherit;">
                        Iniciar sesión
                    </a>
                </div>

            </div>
        </main>

        <footer th:replace="~{fragments :: pie_pagina}"></footer>
    </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <head th:replace="~{fragments :: head_comun('Perfil')}"></head>
    <body>
        <div th:replace="~{fragments :: menu_navegacion}"></div>
        
        <main class="container">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar" th:text="${#strings.substring(usuario.username, 0, 1).toUpperCase()}">U</div>
                    <div>
                        <h2 th:text="${usuario.username}">Nombre de Usuario</h2>
                        <p class="text-gray" th:text="'Miembro desde: ' + ${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy')}"></p>
                    </div>
                </div>
        
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">Email</div>
                        <div class="info-value" th:text="${usuario.email}">email@ejemplo.com</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Roles Asignados</div>
                        <div class="info-value">
                            <span class="badge-rol" th:each="rol : ${usuario.roles}" th:text="${rol.id}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <div th:replace="~{fragments :: pie_pagina}"></div>
    </body>
</html>

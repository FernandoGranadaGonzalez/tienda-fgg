<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login | FGG Store</title>
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
        <head th:replace="~{fragments :: head_comun('Iniciar Sesión')}"></head>
        <style>
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="login-card">
            <a th:href="@{/}" class="logo">
                <span class="logo-icon">🎮</span> FGG
            </a>
            
            <div class="login-header">
                <h2>¡Hola de nuevo!</h2>
                <p>Accede a tu cuenta para continuar</p>
            </div>
            
            <div th:if="${param.registrado}" class="msg success-msg">
                <span>✅</span>
                <span>¡Registro completado! Ya puedes entrar.</span>
            </div>
            
            <div th:if="${error}" class="msg error-msg">
                <span>⚠️</span>
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username"
                           placeholder="Usuario" required autofocus />
                </div>
        
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" required />
                </div>
        
                <button type="submit" class="btn-login">Entrar a mi cuenta</button>
            </form>
            
            <div class="footer-links">
                ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
                <br>
                <a th:href="@{/}" class="back-home">← Volver a la tienda</a>
            </div>
        </div>
    </body>
</html>

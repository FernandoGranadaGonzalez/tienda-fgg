<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{fragments :: head_comun('Catálogo de Juegos')}">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </head>
    <body>
        <div th:replace="~{fragments :: menu_navegacion}"></div>
        
        <div class="container section-spacing">
            <header class="page-header">
                <span class="badge-alt">ADMINISTRACIÓN</span>
                <h1>Catálogo de Productos</h1>
                <p class="subtitle">Listado detallado de videojuegos disponibles.</p>
            </header>
        
            <main class="products-list">
                <div th:each="juego : ${videojuegos}" class="product-row">
                    <div class="product-img-container">
                        <img th:src="${juego.imagen != null && !juego.imagen.isEmpty()}
                                                     ? @{/imagenes/portadas/{img}(img=${juego.imagen})}
                                                     : @{/imagenes/portadas/no-image.png}"
                             th:alt="${juego.titulo != null} ? 'Imagen de ' + ${juego.titulo} : ''"
                             th:onerror="|this.onerror=null;this.src='@{/imagenes/portadas/no-image.png}';|">
                    </div>
        
                    <div class="product-info">
                        <h3 th:text="${juego.titulo}">Título</h3>
                        <p th:text="${#strings.abbreviate(juego.descripcion, 250)}">Descripción corta...</p>
                        <small th:if="${juego.marca}" th:text="'Marca: ' + ${juego.marca.nombre}" style="color: #94a3b8;"></small>                    </div>
        
                    <div class="product-price-action">
                        <th:block th:if="${juego.descuento > 0}">
                            <span class="discount-pill" th:text="'-' + ${juego.descuento} + '% OFF'"></span>
                            <div>
                                <span class="old-price" th:text="${juego.precio} + '€'"></span>
                                <span class="price-tag" th:text="${#numbers.formatDecimal(juego.precio * (1 - juego.descuento/100.0), 1, 2) + '€'}"></span>
                            </div>
                        </th:block>
        
                        <th:block th:unless="${juego.descuento > 0}">
                            <span class="price-tag" th:text="${juego.precio} + '€'"></span>
                        </th:block>
        
                        <a th:href="@{/productos/{id}/{nombre}(id=${juego.id}, nombre=${#strings.replace(#strings.toLowerCase(juego.titulo), ' ', '-')})}"
                           class="explore-link">Detalles →</a>
                    </div>
                </div>
            </main>
        </div>
        <footer th:replace="~{fragments :: pie_pagina}"></footer>
    </body>
</html>

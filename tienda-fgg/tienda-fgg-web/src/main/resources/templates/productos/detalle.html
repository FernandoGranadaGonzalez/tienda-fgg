<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{fragments :: head_comun(${juego.titulo})}">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </head>
    <body>
        <div th:replace="~{fragments :: menu_navegacion}"></div>

        <main class="container section-spacing">
            <a th:href="@{/productos}" class="explore-link">← Volver al inventario</a>

            <div class="detail-container">
                <div class="detail-img">
                    <img th:src="${juego.imagen != null && !juego.imagen.isEmpty()}
                                                     ? @{/imagenes/portadas/{img}(img=${juego.imagen})}
                                                     : @{/imagenes/portadas/no-image.png}"
                         th:alt="'Imagen de ' + ${juego.titulo}"
                         th:onerror="|this.onerror=null;this.src='@{/imagenes/portadas/no-image.png}';|">
                </div>

                <div class="product-info">
                    <span class="badge-alt" th:if="${juego.marca}" th:text="${juego.marca.nombre}">Marca</span>
                    <h1 th:text="${juego.titulo}" style="font-size: 3rem; margin: 10px 0;"></h1>

                    <p><strong>Código EAN-13:</strong> <span class="ean-code" th:text="${juego.codigoEan}"></span></p>

                    <div class="price-section" style="margin: 20px 0;">
                        <th:block th:if="${juego.descuento > 0}">
                            <span class="discount-pill" th:text="'-' + ${juego.descuento} + '%'"></span>
                            <span class="old-price" th:text="${juego.precio} + '€'"></span>
                            <span class="price-tag" style="font-size: 2rem; display: block;"
                                  th:text="${#numbers.formatDecimal(juego.precio * (1 - juego.descuento/100.0), 1, 2) + '€'}"></span>
                        </th:block>
                        <th:block th:unless="${juego.descuento > 0}">
                            <span class="price-tag" style="font-size: 2rem;" th:text="${juego.precio} + '€'"></span>
                        </th:block>
                    </div>

                    <h3 style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">Descripción</h3>
                    <p th:text="${juego.descripcion}" style="line-height: 1.8; color: var(--text-gray); font-size: 1.1rem;"></p>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments :: pie_pagina}"></footer>
    </body>
</html>

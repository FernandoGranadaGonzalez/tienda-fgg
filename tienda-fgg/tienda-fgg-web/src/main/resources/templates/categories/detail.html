<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments :: head_comun}"></head>
    <body>
        <div th:replace="~{fragments :: menu_navegacion}"></div>

        <main class="container">
            <div th:if="${categoria != null}">
                <h1 th:text="${categoria.nombre}">Nombre</h1>

                <section class="category-detail">
                    <div class="category-img">
                        <img th:if="${categoria.imagen != null}"
                             th:src="@{/imagenes/categorias/{img}(img=${categoria.imagen})}" alt="Imagen">

                        <img th:if="${categoria.imagen == null}"
                             th:src="@{/imagenes/categorias/no-image.png}" class="placeholder" alt="Sin imagen">
                    </div>

                    <div class="category-info">
                        <h3>Descripción</h3>
                        <p th:text="${categoria.descripcion}">Descripción...</p>
                        <p><strong>ID:</strong> <span th:text="${categoria.id}">0</span></p>
                    </div>
                </section>

                <hr>

                <section class="games-section">
                    <h2>Videojuegos disponibles</h2>

                    <div th:if="${not #lists.isEmpty(listaJuegos)}">
                        <table class="styled-table">
                            <thead>
                            <tr>
                                <th>Título</th>
                                <th>Descripción</th>
                                <th class="text-right">Precio</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="juego : ${listaJuegos}">
                                <td th:text="${juego.titulo}">Título</td>
                                <td th:text="${juego.descripcion}" class="italic">Desc</td>
                                <td th:text="${#numbers.formatDecimal(juego.precio, 1, 2) + ' €'}" class="text-right bold">0.00 €</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div th:if="${#lists.isEmpty(listaJuegos)}" class="alert">
                        <p>No hay juegos en esta categoría.</p>
                    </div>
                </section>

                <a th:href="@{/categorias}" class="btn-link">&larr; Volver</a>
            </div>

            <div th:if="${categoria == null}" class="error-box">
                <h2>Categoría no encontrada</h2>
                <a th:href="@{/categorias}">Volver al listado</a>
            </div>
        </main>

        <div th:replace="~{fragments :: pie_pagina}"></div>
    </body>
</html>

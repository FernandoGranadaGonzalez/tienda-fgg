<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments :: head_comun}"></head>
    <body>
        <div th:replace="~{fragments :: menu_navegacion}"></div>
        
        <main class="container">
            <div th:if="${categoria != null}">
                <h1 th:text="${categoria.nombre}">Nombre</h1>
        
                <section class="category-detail">
                    <div class="category-img">
                        <img th:if="${categoria.imagen != null}"
                             th:src="@{/imagenes/categorias/{img}(img=${categoria.imagen})}"
                             th:alt="'Imagen de la categoría ' + ${categoria.nombre}">
                        <img th:if="${categoria.imagen == null}"
                             th:src="@{/imagenes/categorias/no-image.png}"
                             class="placeholder"
                             th:alt="'Imagen no disponible'">
                    </div>
        
                    <div class="category-info">
                        <h3>Descripción</h3>
                        <p th:text="${categoria.descripcion}">Descripción...</p>
                        <p><strong>ID:</strong> <span th:text="${categoria.id}">0</span></p>
                    </div>
                </section>
        
                <hr>
        
                <section class="games-section">
                    <h2>Videojuegos disponibles</h2>
        
                    <div th:if="${not #lists.isEmpty(listaJuegos)}" class="games-grid">
                        <div class="game-card" th:each="juego : ${listaJuegos}">
                            <div class="card-img">
                                <img th:src="@{/imagenes/portadas/{img}(img=${juego.imagen != null ? juego.imagen : 'default.jpg'})}"
                                     th:alt="${juego.titulo}">
                            </div>
                            <div class="card-content">
                                <h3 th:text="${juego.titulo}">Título</h3>
                                <p th:text="${juego.descripcion}">Descripción corta...</p>
                                <div class="card-footer">
                                    <span class="price" th:text="${#numbers.formatDecimal(juego.precio, 1, 2) + ' €'}">0.00 €</span>
                                </div>
                            </div>
                        </div>
                    </div>
        
                    <div th:if="${#lists.isEmpty(listaJuegos)}" class="alert">
                        <p>No hay juegos en esta categoría actualmente.</p>
                    </div>
                </section>
        
                <br>
                <a th:href="@{/categorias}" class="btn-link">&larr; Volver al listado</a>
            </div>
        
            <div th:if="${categoria == null}" class="error-box">...</div>
        </main>
        
        <div th:replace="~{fragments :: pie_pagina}"></div>
    </body>
</html>

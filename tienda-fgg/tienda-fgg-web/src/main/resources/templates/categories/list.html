<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{fragments :: head_comun('Categorías')}">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </head>
    <body>
        <div th:replace="~{fragments :: menu_navegacion}"></div>
        
        <main class="container section-spacing">
            <header class="page-header">
                <span class="badge-alt">GÉNEROS</span>
                <h1>Categorías</h1>
                <p class="subtitle">Elige tu género favorito y descubre los mejores títulos disponibles.</p>
            </header>
        
            <div class="categories-list-grid">
                <div class="category-item-card" th:each="category : ${categorias}">
                    <div class="cat-item-img">
                        <img th:src="@{/imagenes/categorias/{img}(img=${category.imagen != null ? category.imagen : 'no-image.png'})}"
                             th:alt="${category.nombre}">
                    </div>
                    <div class="cat-item-body">
                        <h3 th:text="${category.nombre}">Aventuras</h3>
                        <p th:text="${category.descripcion}">Explora mundos épicos sin límites</p>
                        <a th:href="@{/categorias/{id}(id=${category.id})}" class="explore-link">
                            Explorar <span class="arrow">➔</span>
                        </a>
                    </div>
                </div>
            </div>
        </main>
        
        <footer th:replace="~{fragments :: pie_pagina}"></footer>
    </body>
</html>

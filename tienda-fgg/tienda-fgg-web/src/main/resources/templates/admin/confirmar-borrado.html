<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Confirmar Borrado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/admin/css/estilos-admin.css}">
    </head>
    <body class="bg-light">
        <header th:replace="~{admin/fragments :: admin-nav}"></header>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card border-danger shadow">
                        <div class="card-header bg-danger text-white">
                            <h2 class="h5 mb-0">Atención: Confirmar Borrado</h2>
                        </div>
                        <div class="card-body text-center">
                            <p>
                                ¿Estás seguro de que quieres eliminar este elemento:
                                <strong th:text="${elemento instanceof T(es.iesclaradelrey.da2d1a.tiendafgg.common.entities.Videojuego) ? elemento.titulo : elemento.nombre}"></strong>?
                            </p>

                            <div th:if="${error}" class="alert alert-warning mb-4" th:text="${error}"></div>

                            <form th:action="${urlBorrar}" method="post">
                                <div class="d-flex justify-content-center gap-3">
                                    <button type="submit" class="btn btn-danger">Aceptar</button>
                                    <a th:href="@{/admin}" class="btn btn-secondary">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{admin/fragments :: admin-scripts}"></div>
    </body>
</html>

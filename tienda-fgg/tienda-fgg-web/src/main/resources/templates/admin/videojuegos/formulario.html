<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Administración - Nuevo Videojuego</title>
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/admin/css/estilos-admin.css}">
    </head>
    <body class="bg-light">
        <header th:replace="~{admin/fragments :: admin-nav}"></header>
        <div class="container mt-5 mb-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Nuevo Videojuego</h2>
                </div>
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
                    <form th:action="@{/admin/productos/save}" th:object="${videojuego}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" th:field="*{titulo}" class="form-control" required>
                        </div>
        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Código EAN-13</label>
                                <input type="text" th:field="*{codigoEan}" class="form-control">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Precio (€)</label>
                                <input type="number" th:field="*{precio}" class="form-control" step="0.01" min="0"/>
                                <div th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" class="text-danger"></div>
                            </div>
                            <div class="col-md-3 mb-3">
                                <label class="form-label">Descuento (%)</label>
                                <input type="number" th:field="*{descuento}" class="form-control">
                                <div th:if="${#fields.hasErrors('descuento')}" th:errors="*{descuento}" class="text-danger"></div>
                            </div>
                        </div>
        
                        <div class="mb-3">
                            <label class="form-label">Marca / Desarrolladora</label>
                            <select th:field="*{marca}" class="form-select">
                                <option value="">Seleccione una marca...</option>
                                <option th:each="m : ${marcas}" th:value="${m.id}" th:text="${m.nombre}"></option>
                            </select>
                        </div>
        
                        <div class="mb-3">
                            <label class="form-label d-block">Categorías</label>
                            <div class="form-check form-check-inline" th:each="cat : ${todasCategorias}">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{categorias}" th:value="${cat.id}">
                                <label class="form-check-label" th:text="${cat.nombre}"></label>
                            </div>
                        </div>
        
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                        </div>
        
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">Aceptar</button>
                            <a th:href="@{/admin/productos}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div th:replace="~{admin/fragments :: admin-scripts}"></div>
    </body>
</html>

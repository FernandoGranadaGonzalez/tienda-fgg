<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Administración - Listado de Videojuegos</title>
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="stylesheet" th:href="@{/admin/css/estilos-admin.css}">
    </head>
    <body class="bg-light">
        <header th:replace="~{admin/fragments :: admin-nav}"></header>
        <div class="container mt-5">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1>Gestión de Videojuegos</h1>
                <a th:href="@{/admin/productos/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Nuevo Videojuego
                </a>
            </header>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Marca</th>
                            <th>Precio</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="juego : ${elementos}">
                            <td th:text="${juego.id}">1</td>
                            <td th:text="${juego.titulo}">Juego</td>
                            <td th:text="${juego.marca.nombre}">Marca</td>
                            <td th:text="${juego.precio} + '€'">0.00€</td>
                            <td class="text-center">
                                <a th:href="@{/admin/productos/{id}/edit(id=${juego.id})}"
                                   class="btn btn-sm btn-outline-primary me-2"
                                   title="Editar elemento" aria-label="Editar videojuego">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/admin/productos/{id}/delete(id=${juego.id})}"
                                   class="btn btn-sm btn-outline-danger"
                                   title="Borrar elemento" aria-label="Borrar videojuego">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                        <tfoot class="table-light">
                        <tr>
                            <td colspan="5" class="small text-muted">Mostrando todos los videojuegos registrados.</td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="mt-3">
                <a th:href="@{/admin}" class="btn btn-secondary">Volver al Panel</a>
            </div>
        </div>
        <div th:replace="~{admin/fragments :: admin-scripts}"></div>
    </body>
</html>

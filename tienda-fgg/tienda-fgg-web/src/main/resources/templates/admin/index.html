<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Panel de Administración - Tienda Retro</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/admin/css/estilos-admin.css}">
    </head>
    <body class="bg-light">
        <header th:replace="~{admin/fragments :: admin-nav}"></header>
        <main class="container">
            <div class="row text-center">
                <div class="col-12 mb-4">
                    <h1 class="display-5">Gestión de la Tienda</h1>
                    <p class="text-muted">Seleccione el área que desea administrar</p>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Marcas</h5>
                            <p class="card-text">Gestionar fabricantes y marcas.</p>
                            <a th:href="@{/admin/marcas}" class="btn btn-primary w-100">Ir a Marcas</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card h-100 shadow-sm border-primary">
                        <div class="card-body">
                            <h5 class="card-title">Videojuegos</h5>
                            <p class="card-text">Alta, baja y edición del catálogo.</p>
                            <a th:href="@{/admin/productos}" class="btn btn-primary w-100">Ir a Productos</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Categorías</h5>
                            <p class="card-text">Organizar los juegos por género.</p>
                            <a th:href="@{/admin/categorias}" class="btn btn-primary w-100">Ir a Categorías</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div th:replace="~{admin/fragments :: admin-scripts}"></div>
    </body>
</html>

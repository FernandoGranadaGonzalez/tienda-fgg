<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Administración - Gestión de Categoría</title>
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/admin/css/estilos-admin.css}">
    </head>
    <body class="bg-light">
        <header th:replace="~{admin/fragments :: admin-nav}"></header>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h2 class="h5 mb-0" th:text="${categoria.id == null} ? 'Nueva Categoría' : 'Editar Categoría'">Categoría</h2>
                        </div>
                        <div class="card-body">
                            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                            <form th:action="@{/admin/categorias/save}" th:object="${categoria}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label class="form-label">Nombre del Género</label>
                                    <input type="text" th:field="*{nombre}" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Descripción</label>
                                    <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">Aceptar</button>
                                    <a th:href="@{/admin/categorias}" class="btn btn-secondary">Cancelar</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{admin/fragments :: admin-scripts}"></div>
    </body>
</html>

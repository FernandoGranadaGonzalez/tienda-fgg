<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Administración - Listado de Categorías</title>
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link rel="stylesheet" th:href="@{/admin/css/estilos-admin.css}">
    </head>
    <body class="bg-light">
        <header th:replace="~{admin/fragments :: admin-nav}"></header>
        <div class="container mt-5">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h1>Gestión de Categorías</h1>
                <a th:href="@{/admin/categorias/new}" class="btn btn-success">
                    <i class="bi bi-plus-circle"></i> Nueva Categoría
                </a>
            </header>
        
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat : ${elementos}">
                            <td th:text="${cat.id}">1</td>
                            <td th:text="${cat.nombre}">Nombre</td>
                            <td th:text="${cat.descripcion}">Descripción</td>
                            <td class="text-center">
                                <a th:href="@{/admin/categorias/{id}/edit(id=${cat.id})}"
                                   class="btn btn-sm btn-outline-primary me-2" aria-label="Editar categoría">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                
                                <a th:href="@{/admin/categorias/{id}/delete(id=${cat.id})}"
                                   class="btn btn-sm btn-outline-danger" aria-label="Borrar categoría">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                        <tfoot class="table-light">
                        <tr>
                            <td colspan="4" class="small p-3 text-muted">Gestión de géneros y categorías de videojuegos.</td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            <div class="mt-3">
                <a th:href="@{/admin}" class="btn btn-secondary">Volver al Panel</a>
            </div>
        </div>
        <div th:replace="~{admin/fragments :: admin-scripts}"></div>
    </body>
</html>
